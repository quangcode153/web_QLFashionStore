name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore FashionStore.sln
      - name: Run Backend Tests
        env:
          JWT_SECRET_KEY: "FashionStore_Secret_Key_Super_Secure_2026_JWT_Token_AtLeast_32Characters!"
          PASSWORD_PEPPER: "FashionStore_Secret_Pepper_Password_Hasher_2026_Secure_Key_X9#mK@vL!"
          CONNECTION_STRING: "Server=localhost;Database=FashionStore;Trusted_Connection=True;TrustServerCertificate=True;"
        run: |
          dotnet test tests/Backend.Tests/Backend.Tests.csproj > test_backend.log 2>&1 || (cat test_backend.log && exit 1)

      - name: Run Frontend Tests
        run: dotnet test tests/Frontend.Tests/Frontend.Tests.csproj --logger "console;verbosity=normal"

  docker-publish:
    name: Docker Hub Publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: quangcode153/fashion-backend:latest
      - uses: docker/build-push-action@v5
        with:
          context: ./Chat_bot
          file: ./Chat_bot/Dockerfile
          push: true
          tags: quangcode153/fashion-chatbot:latest

  deploy-wsl:
    name: Deploy WSL
    needs: docker-publish
    runs-on: self-hosted
    steps:
      - run: |
          cd ~/fashion_store
          docker compose pull
          docker compose up -d

  vercel-deploy:
    name: Publish Frontend to Vercel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Frontend Changes (Chỉ deploy khi bản mới có thay đổi)
        id: check_changes
        run: |
          if [ $(git rev-list --count HEAD) -gt 1 ]; then
            CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E '^(frontend/|shared/)' || true)
          else
            CHANGED="initial"
          fi

          if [ -n "$CHANGED" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Phát hiện thay đổi trong mã nguồn frontend/shared:"
            echo "$CHANGED"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⏭️ Không có thay đổi trong frontend/shared. Bỏ qua bước build & deploy Vercel."
          fi

      - name: Setup .NET 8 SDK
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Publish Release Frontend
        if: steps.check_changes.outputs.has_changes == 'true'
        run: dotnet publish frontend/Frontend.csproj -c Release -o release-frontend

      - name: Deploy to Vercel Production
        if: steps.check_changes.outputs.has_changes == 'true' && env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID || 'team_5HzRnccDuVtZ3wA0ZPd5zCmS' }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID || 'prj_lWMBvJYggkCLBLta7idz325Ys365' }}
          working-directory: ./release-frontend/wwwroot
          vercel-args: '--prod --alias qf-fashion.vercel.app'

