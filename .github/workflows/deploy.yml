name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore backend/Backend.csproj
      - run: dotnet build backend/Backend.csproj -c Release

  docker-publish:
    name: Docker Hub Publish
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-qemu-action@v3
      - uses: actions/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: quangcode153/fashion-backend:latest
      - uses: docker/build-push-action@v5
        with:
          context: ./Chat_bot
          file: ./Chat_bot/Dockerfile
          push: true
          tags: quangcode153/fashion-chatbot:latest

  deploy-wsl:
    name: Deploy WSL
    needs: docker-publish
    runs-on: self-hosted
    steps:
      - run: |
          cd ~/fashion_store
          docker compose pull
          docker compose up -d

  vercel-deploy:
    name: Publish Frontend
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish frontend/Frontend.csproj -c Release -o release-frontend
      - uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./release-frontend/wwwroot
          vercel-args: '--prod'
