services:
  # ==============================================================================
  # 1. DATABASE SERVICE (Microsoft SQL Server 2022)
  # ==============================================================================
  fashion-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fashion-db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-FashionStore@2026!Strong}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
    networks:
      - fashion-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==============================================================================
  # 2. BACKEND API SERVICE (ASP.NET Core 8.0 & SignalR WebSockets)
  # Image tải trực tiếp từ Docker Hub: quangcode153/fashion-backend:latest
  # ==============================================================================
  fashion-backend:
    image: quangcode153/fashion-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fashion-backend
    restart: unless-stopped
    depends_on:
      fashion-db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_HTTP_PORTS=5000
      - CONNECTION_STRING=Server=fashion-db,1433;Database=FashionStore;User Id=sa;Password=${MSSQL_SA_PASSWORD:-FashionStore@2026!Strong};TrustServerCertificate=True;MultipleActiveResultSets=True;
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-SuperSecretKeyForFashionStoreBTL2026VeryStrong!}
      - JWT_ISSUER=FashionStoreBackend
      - JWT_AUDIENCE=FashionStoreClients
      - PASSWORD_PEPPER=${PASSWORD_PEPPER:-PepperSecretKeyFashionStore2026}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,https://*.vercel.app,${FRONTEND_VERCEL_URL:-}
    networks:
      - fashion-net

  # ==============================================================================
  # 3. CHATBOT STYLIST AI MICROSERVICE (Node.js & Groq AI)
  # Image tải trực tiếp từ Docker Hub: quangcode153/fashion-chatbot:latest
  # ==============================================================================
  fashion-chatbot:
    image: quangcode153/fashion-chatbot:latest
    build:
      context: ./Chat_bot
      dockerfile: Dockerfile
    container_name: fashion-chatbot
    restart: unless-stopped
    depends_on:
      fashion-db:
        condition: service_healthy
      fashion-backend:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_SERVER=fashion-db
      - DB_PORT=1433
      - DB_NAME=FashionStore
      - DB_USER=sa
      - DB_PASSWORD=${MSSQL_SA_PASSWORD:-FashionStore@2026!Strong}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - fashion-net

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  mssql_data:
    name: fashion_mssql_data

networks:
  fashion-net:
    name: fashion-net
    driver: bridge
